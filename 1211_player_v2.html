<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1211 英式英语播放器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#222}
.wrap{max-width:720px;margin:auto;padding:22px 14px 40px}h1{text-align:center;font-size:28px;margin:8px 0}.sub{text-align:center;color:#777;margin-bottom:18px}
.card{background:#fff;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 4px 18px #00000010}.num{color:#888;font-size:14px}.word{font-size:42px;font-weight:700;margin:12px 0 5px}.ipa{color:#666;font-size:18px}.meaning{font-size:20px;margin-top:12px;line-height:1.6}.example{margin-top:18px;padding:15px;background:#f7f7f7;border-radius:12px;line-height:1.6}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}button{border:0;border-radius:11px;padding:13px;font-size:16px;background:#eee}button.primary{background:#222;color:#fff}.wide{grid-column:1/-1}.nav{display:flex;gap:10px;margin-top:10px}.nav button{flex:1}.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}.setting{display:flex;flex-direction:column;gap:6px;color:#666;font-size:14px}.setting select{padding:9px;border:1px solid #ccc;border-radius:8px;font-size:15px}@media(max-width:560px){.word{font-size:36px}.settings{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>1211 英式英语播放器</h1>
<div class="sub">点击播放：英文单词 → 中文释义 → 英文例句</div>

<div class="card">
<div class="num" id="num">加载中...</div>
<div class="word" id="word">—</div>
<div class="ipa" id="ipa">—</div>
<div class="meaning" id="meaning">—</div>
<div class="example" id="example">—</div>

<div class="buttons">
<button class="primary wide" onclick="playAll()">▶ 播放全部</button>
<button onclick="stopPlay()">■ 停止</button>
<button onclick="speakWord()">🔊 单词</button>
</div>

<div class="nav">
<button onclick="prev()">← 上一个</button>
<button onclick="next()">下一个 →</button>
</div>
</div>

<div class="card settings">
<label class="setting">英文速度
<select id="enRate"><option value=".75">0.75×</option><option value=".9">0.9×</option><option value="1" selected>1.0×</option><option value="1.1">1.1×</option><option value="1.25">1.25×</option></select></label>
<label class="setting">中文速度
<select id="zhRate"><option value=".75">0.75×</option><option value=".9" selected>0.9×</option><option value="1">1.0×</option></select></label>
<label class="setting">每词播放
<select id="repeat"><option value="1">1 次</option><option value="2" selected>2 次</option><option value="3">3 次</option></select></label>
<label class="setting">播放完后
<select id="after"><option value="stay">停留当前词</option><option value="next" selected>自动下一个</option></select></label>
</div>
</div>

<script>
let words=[],i=0,playing=false,runId=0;

async function load(){
 try{
  const r=await fetch("words.json?"+Date.now());
  if(!r.ok)throw new Error();
  words=await r.json();
  if(!words.length)throw new Error();
  i=Math.min(Number(localStorage.getItem("1211_index")||0),words.length-1);
  show();
 }catch(e){
  document.getElementById("word").textContent="词库加载失败";
  document.getElementById("meaning").textContent="请确认 words.json 与 index.html 在同一目录。";
 }
}
function show(){
 const w=words[i]; if(!w)return;
 document.getElementById("num").textContent=`${i+1} / ${words.length}`;
 document.getElementById("word").textContent=w.word||"";
 document.getElementById("ipa").textContent=w.phonetic||w.ipa||"";
 document.getElementById("meaning").textContent=w.meaning||w.cn||"";
 document.getElementById("example").textContent=w.example||"";
 localStorage.setItem("1211_index",i);
}
function findVoice(lang){
 const vs=speechSynthesis.getVoices();
 return vs.find(v=>v.lang.toLowerCase()===lang.toLowerCase()) ||
        vs.find(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase()));
}
function speak(text,lang,rate,id){
 return new Promise(resolve=>{
  if(!text){resolve();return}
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang;u.rate=rate;
  const v=findVoice(lang);if(v)u.voice=v;
  u.onend=resolve;u.onerror=resolve;
  if(id!==runId){resolve();return}
  speechSynthesis.speak(u);
 });
}
async function playAll(){
 if(!words.length)return;
 stopPlay(false);playing=true;const my=++runId;
 const w=words[i];
 const repeat=Number(document.getElementById("repeat").value);
 for(let n=0;n<repeat;n++){
  if(my!==runId)return;
  await speak(w.word,"en-GB",Number(document.getElementById("enRate").value),my);
  if(my!==runId)return;
  await new Promise(r=>setTimeout(r,350));
  await speak(w.meaning||w.cn,"zh-CN",Number(document.getElementById("zhRate").value),my);
  if(my!==runId)return;
  await new Promise(r=>setTimeout(r,450));
  await speak(w.example,"en-GB",Number(document.getElementById("enRate").value),my);
  if(my!==runId)return;
  if(n<repeat-1)await new Promise(r=>setTimeout(r,700));
 }
 playing=false;
 if(document.getElementById("after").value==="next"&&my===runId){
  i=(i+1)%words.length;show();
 }
}
function speakWord(){
 if(!words.length)return;
 stopPlay(false);runId++;playing=true;
 speak(words[i].word,"en-GB",Number(document.getElementById("enRate").value),runId).then(()=>playing=false);
}
function stopPlay(increment=true){
 speechSynthesis.cancel();playing=false;if(increment)runId++;
}
function next(){stopPlay();i=(i+1)%words.length;show()}
function prev(){stopPlay();i=(i-1+words.length)%words.length;show()}
speechSynthesis.onvoiceschanged=()=>findVoice("en-GB");
load();
</script>
</body>
</html>
