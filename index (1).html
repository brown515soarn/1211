<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>1211 英式英语播放器</title>
<style>
:root{--border:#d9d9d9;--muted:#666;--bg:#f7f7f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",Arial,sans-serif;color:#111}
.wrap{max-width:760px;margin:auto;padding:20px 16px 36px}
h1{font-size:28px;margin:4px 0 6px}.sub{color:var(--muted);margin:0 0 18px}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 2px 8px #00000008}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}
.word{font-size:44px;font-weight:750;line-height:1.1;margin:12px 0 6px;word-break:break-word}
.ipa{font-size:19px;color:#555;margin-bottom:8px}.meaning{font-size:18px}.meta{margin-top:10px;color:#555}
.example{margin-top:16px;padding-top:14px;border-top:1px solid #eee;line-height:1.55}.example b{display:block;margin-bottom:4px}
.controls{display:flex;flex-wrap:wrap;gap:8px}.controls button,.controls select,.controls input{font:inherit}
button,select,input{border:1px solid #bbb;border-radius:10px;background:#fff;padding:10px 13px}
button{cursor:pointer}button.primary{font-weight:700}
button:active{transform:translateY(1px)}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.setting{display:flex;flex-direction:column;gap:6px;color:#555;font-size:14px}
.setting input{width:100%}
.progress{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:12px 0}.bar{height:100%;width:0;background:#111}
.status{font-size:13px;color:#666;margin-top:10px}
.addgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.addgrid input{width:100%}.addgrid .wide{grid-column:1/-1}
@media(max-width:560px){.settings,.addgrid{grid-template-columns:1fr}.word{font-size:38px}}
</style>
</head>
<body>
<div class="wrap">
<h1>1211 英式英语播放器</h1>
<p class="sub">云端词库 · 英式发音 · 自动播放 · 单词/例句/单词+例句</p>

<div class="card">
  <div class="top"><span id="num">加载中…</span><span id="loadStatus">正在读取云词库</span></div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="word" id="word">—</div>
  <div class="ipa" id="ipa">—</div>
  <div class="meaning" id="cn">—</div>
  <div class="meta" id="pos"></div>
  <div class="example"><b>例句</b><span id="example">—</span></div>
</div>

<div class="card">
  <div class="controls">
    <button class="primary" onclick="speakWord()">🔊 播放单词</button>
    <button onclick="speakExample()">▶ 播放例句</button>
    <button onclick="speakBoth()">▶▶ 单词＋例句</button>
    <button onclick="toggleAuto()" id="autoBtn">自动播放：关</button>
    <button onclick="prev()">← 上一个</button>
    <button onclick="next()">下一个 →</button>
  </div>
</div>

<div class="card settings">
  <label class="setting">播放速度
    <select id="rate" onchange="saveSettings()">
      <option value="0.75">0.75×</option><option value="0.9">0.9×</option><option value="1" selected>1.0×</option>
      <option value="1.1">1.1×</option><option value="1.25">1.25×</option>
    </select>
  </label>
  <label class="setting">每词重复
    <select id="repeat" onchange="saveSettings()">
      <option value="1">1 次</option><option value="2" selected>2 次</option><option value="3">3 次</option>
      <option value="4">4 次</option><option value="5">5 次</option>
    </select>
  </label>
</div>

<div class="card">
  <b>添加新词</b>
  <p class="status">填写后可生成新的 words.json；上传到 GitHub 后，云端词库就会更新。</p>
  <div class="addgrid">
    <input id="newWord" placeholder="单词 *">
    <input id="newIpa" placeholder="音标">
    <input id="newPos" placeholder="词性，如 n.">
    <input id="newCount" placeholder="名词：C / U / C/U">
    <input id="newCn" class="wide" placeholder="中文释义 *">
    <input id="newExample" class="wide" placeholder="英文例句">
  </div>
  <div class="controls" style="margin-top:10px">
    <button onclick="addWord()">加入词库</button>
    <button onclick="downloadJson()">导出 words.json</button>
  </div>
</div>

<div class="card">
  <b>键盘操作</b>
  <div class="status">← 上一个　→ 下一个　Space 播放当前词</div>
</div>
</div>

<script>
let words=[], i=0, auto=false, speaking=false, timer=null;

const $=id=>document.getElementById(id);

fetch('words.json?ts='+Date.now(),{cache:'no-store'})
.then(r=>{if(!r.ok) throw new Error('词库读取失败'); return r.json()})
.then(d=>{words=Array.isArray(d)?d:[]; loadSettings(); show(); $('loadStatus').textContent='云词库已加载';})
.catch(e=>{$('loadStatus').textContent='词库加载失败，请检查 words.json';});

function show(){
 if(!words.length)return;
 const w=words[i];
 $('num').textContent=`${String(i+1).padStart(2,'0')} / ${words.length}`;
 $('word').textContent=w.word||'';
 $('ipa').textContent=w.ipa||'';
 $('cn').textContent=w.cn||'';
 $('pos').textContent=[w.pos,w.countable?'名词：'+w.countable:''].filter(Boolean).join(' · ');
 $('example').textContent=w.example||'';
 $('bar').style.width=((i+1)/words.length*100)+'%';
 localStorage.setItem('1211_index',i);
}

function settings(){
 return {rate:parseFloat($('rate').value),repeat:parseInt($('repeat').value)};
}
function saveSettings(){localStorage.setItem('1211_settings',JSON.stringify(settings()));}
function loadSettings(){
 const s=JSON.parse(localStorage.getItem('1211_settings')||'null');
 if(s){$('rate').value=s.rate||1;$('repeat').value=s.repeat||2}
 i=Math.min(parseInt(localStorage.getItem('1211_index')||0),Math.max(0,words.length-1));
}

function voiceSpeak(text,done){
 if(!text){done&&done();return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang='en-GB';u.rate=settings().rate;
 u.onend=()=>done&&done();u.onerror=()=>done&&done();
 speechSynthesis.speak(u);
}
function repeatSpeak(text,n,done){
 let k=0;
 function one(){if(k++>=n){done&&done();return}voiceSpeak(text,one)}
 one();
}
function speakWord(){if(!words.length)return;repeatSpeak(words[i].word,settings().repeat)}
function speakExample(){if(!words.length)return;voiceSpeak(words[i].example)}
function speakBoth(){
 if(!words.length)return;
 repeatSpeak(words[i].word,settings().repeat,()=>voiceSpeak(words[i].example));
}
function autoPlayCurrent(){
 if(!auto)return;
 clearTimeout(timer);
 speakBoth();
 timer=setTimeout(()=>{if(auto){next();autoPlayCurrent()}},Math.max(2500,(words[i].example||'').length*65));
}
function toggleAuto(){
 auto=!auto;$('autoBtn').textContent='自动播放：'+(auto?'开':'关');
 if(auto)autoPlayCurrent();else{clearTimeout(timer);speechSynthesis.cancel();}
}
function next(){if(!words.length)return;i=(i+1)%words.length;show();if(auto)autoPlayCurrent()}
function prev(){if(!words.length)return;i=(i-1+words.length)%words.length;show();if(auto)autoPlayCurrent()}

function addWord(){
 const word=$('newWord').value.trim(),cn=$('newCn').value.trim();
 if(!word||!cn){alert('请至少填写单词和中文释义');return}
 words.push({word,ipa:$('newIpa').value.trim(),pos:$('newPos').value.trim(),countable:$('newCount').value.trim(),cn,example:$('newExample').value.trim()});
 i=words.length-1;show();
 ['newWord','newIpa','newPos','newCount','newCn','newExample'].forEach(x=>$(x).value='');
 alert('已加入当前词库。点击“导出 words.json”，再把导出的文件上传到 GitHub，即可更新云端词库。');
}
function downloadJson(){
 const blob=new Blob([JSON.stringify(words,null,2)],{type:'application/json;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='words.json';a.click();
 URL.revokeObjectURL(a.href);
}
document.addEventListener('keydown',e=>{
 if(e.target.matches('input,select'))return;
 if(e.key==='ArrowRight')next();
 else if(e.key==='ArrowLeft')prev();
 else if(e.code==='Space'){e.preventDefault();speakWord();}
});
</script>
</body>
</html>
