<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>1211 英式英语播放器</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    max-width:700px;
    margin:auto;
    padding:30px;
}
.card{
    background:white;
    border-radius:20px;
    padding:30px;
    margin-top:30px;
    box-shadow:0 5px 20px #ddd;
}
#num{
    color:#777;
    margin-bottom:20px;
}
.word{
    font-size:45px;
    font-weight:bold;
    text-align:center;
}
.ipa,.meaning{
    text-align:center;
    margin:15px;
    font-size:20px;
}
button{
    padding:12px 20px;
    margin:8px;
    border-radius:10px;
    border:1px solid #aaa;
    background:white;
    cursor:pointer;
}
</style>

</head>

<body>

<h1>1211 英式英语播放器</h1>

<div class="card">

<div id="num">加载中...</div>

<div id="word" class="word"></div>

<div id="ipa" class="ipa"></div>

<div id="pos" class="ipa"></div>

<div id="meaning" class="meaning"></div>


<button onclick="speak()">🔊 英式发音</button>

<br>

<button onclick="prev()">←</button>
<button onclick="next()">→</button>


</div>


<script>

let words=[];
let index=0;


fetch("words.json")
.then(response=>{
    if(!response.ok){
        throw new Error("words.json加载失败");
    }
    return response.json();
})
.then(data=>{
    words=data;
    show();
})
.catch(error=>{
    document.getElementById("num").innerText=error;
});


function show(){

let w=words[index];

document.getElementById("num").innerText=
(index+1)+"/"+words.length;


document.getElementById("word").innerText=w.word || "";

document.getElementById("ipa").innerText=w.ipa || "";

document.getElementById("pos").innerText=w.pos || "";

document.getElementById("meaning").innerText=w.meaning || "";

}


function next(){

if(index<words.length-1){
index++;
show();
}

}


function prev(){

if(index>0){
index--;
show();
}

}


function speak(){

let u=new SpeechSynthesisUtterance(words[index].word);

u.lang="en-GB";

speechSynthesis.speak(u);

}


</script>


</body>
</html>
