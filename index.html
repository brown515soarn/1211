<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>1211 英式英语播放器</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.container{max-width:760px;margin:auto;padding:28px 16px 45px}
h1{text-align:center;font-size:28px;margin:0 0 8px}
.sub{text-align:center;color:#777;margin-bottom:22px}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 5px 20px rgba(0,0,0,.08)}
.progress{color:#888;font-size:14px;margin-bottom:15px}
.word{font-size:42px;font-weight:700;margin-bottom:7px}
.phonetic{font-size:18px;color:#666;margin-bottom:12px}
.meaning{font-size:20px;line-height:1.6}
.count{margin-top:6px;color:#777;font-size:14px}
.example{margin-top:20px;padding:15px;background:#f7f8fa;border-radius:12px;line-height:1.6}
.example-en{font-size:17px}
.example-cn{color:#666;margin-top:7px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
button{border:0;border-radius:11px;padding:13px;font-size:16px;background:#eee;cursor:pointer}
.primary{grid-column:1/-1;background:#222;color:white;font-size:18px}
.nav{display:flex;gap:10px;margin-top:12px}
.nav button{flex:1}
.settings{margin-top:18px;background:#fff;border-radius:15px;padding:18px}
.row{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
select{padding:8px;border:1px solid #ccc;border-radius:8px}
@media(max-width:560px){.word{font-size:36px}.buttons{grid-template-columns:1fr}.primary{grid-column:auto}}
</style>
</head>
<body>
<div class="container">
<h1>1211 英式英语播放器</h1>
<div class="sub">英文 → 中文 → 英文例句</div>

<div class="card">
<div class="progress" id="progress">加载中...</div>
<div class="word" id="word">—</div>
<div class="phonetic" id="phonetic">—</div>
<div class="meaning" id="meaning">—</div>
<div class="count" id="count"></div>

<div class="example">
<div class="example-en" id="exampleEn">—</div>
<div class="example-cn" id="exampleCn">—</div>
</div>

<div class="buttons">
<button class="primary" onclick="playSequence()">🔊 播放：英文 → 中文 → 英文例句</button>
<button onclick="speakWordOnly()">只播放英文</button>
<button onclick="speakExampleOnly()">只播放英文例句</button>
</div>

<div class="nav">
<button onclick="previousWord()">← 上一个</button>
<button onclick="nextWord()">下一个 →</button>
</div>
</div>

<div class="settings">
<div class="row">
<span>英文播放速度</span>
<select id="speed">
<option value="0.7">0.7×</option>
<option value="0.85">0.85×</option>
<option value="1" selected>1.0×</option>
<option value="1.15">1.15×</option>
<option value="1.3">1.3×</option>
</select>
</div>
<div class="row">
<span>英文单词重复</span>
<select id="repeat">
<option value="1">1 次</option>
<option value="2" selected>2 次</option>
<option value="3">3 次</option>
</select>
</div>
<div class="row">
<span>播放完自动下一个</span>
<input type="checkbox" id="autoNext">
</div>
</div>
</div>

<script>
let words=[];
let index=0;
let stopped=false;

async function loadWords(){
 try{
  const r=await fetch("words.json?"+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("words.json加载失败");
  words=await r.json();
  if(!Array.isArray(words)||!words.length) throw new Error("词库为空");
  show();
 }catch(e){
  document.getElementById("word").textContent="加载失败";
  document.getElementById("meaning").textContent="请确认 words.json 与 index.html 在同一目录。";
 }
}

function show(){
 const w=words[index];
 document.getElementById("progress").textContent=(index+1)+" / "+words.length;
 document.getElementById("word").textContent=w.word||"";
 document.getElementById("phonetic").textContent=w.phonetic||"";
 document.getElementById("meaning").textContent=w.meaning||"";
 document.getElementById("count").textContent=w.countable?("名词："+w.countable):"";
 document.getElementById("exampleEn").textContent=w.example||"";
 document.getElementById("exampleCn").textContent=w.exampleCn||"";
}

function getVoice(lang){
 const voices=speechSynthesis.getVoices();
 return voices.find(v=>v.lang.toLowerCase()==="en-gb") ||
        voices.find(v=>v.lang.toLowerCase().startsWith(lang.toLowerCase())) ||
        null;
}

function speak(text,lang,rate,done){
 if(!text){done&&done();return;}
 const u=new SpeechSynthesisUtterance(text);
 u.lang=lang;
 const v=getVoice(lang);
 if(v)u.voice=v;
 u.rate=rate;
 u.pitch=1;
 u.onend=()=>done&&done();
 u.onerror=()=>done&&done();
 speechSynthesis.speak(u);
}

/* 核心顺序：
   1. 英文单词
   2. 中文释义
   3. 英文例句
*/
function playSequence(){
 if(!words.length)return;
 stopped=false;
 speechSynthesis.cancel();
 const w=words[index];
 const rate=Number(document.getElementById("speed").value);
 const repeat=Number(document.getElementById("repeat").value);
 let n=0;

 function word(){
  if(stopped)return;
  n++;
  speak(w.word,"en-GB",rate,()=>{
   if(n<repeat){
    setTimeout(word,350);
   }else{
    setTimeout(chinese,600);
   }
  });
 }

 function chinese(){
  if(stopped)return;
  speak(w.meaning,"zh-CN",1,()=>{
   setTimeout(example,700);
  });
 }

 function example(){
  if(stopped)return;
  speak(w.example,"en-GB",rate,()=>{
   if(document.getElementById("autoNext").checked){
    setTimeout(()=>{
     nextWord();
     playSequence();
    },1200);
   }
  });
 }

 word();
}

function speakWordOnly(){
 stopped=false;
 speechSynthesis.cancel();
 const w=words[index];
 const rate=Number(document.getElementById("speed").value);
 speak(w.word,"en-GB",rate);
}

function speakExampleOnly(){
 stopped=false;
 speechSynthesis.cancel();
 const w=words[index];
 const rate=Number(document.getElementById("speed").value);
 speak(w.example,"en-GB",rate);
}

function nextWord(){
 speechSynthesis.cancel();
 stopped=true;
 index=(index+1)%words.length;
 show();
}

function previousWord(){
 speechSynthesis.cancel();
 stopped=true;
 index=(index-1+words.length)%words.length;
 show();
}

speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
loadWords();
</script>
</body>
</html>
