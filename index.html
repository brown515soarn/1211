<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>1211 英式英语播放器</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{max-width:700px;margin:auto;padding:20px;font-family:sans-serif}.card{border:1px solid #ccc;border-radius:15px;padding:20px}.word{font-size:40px;font-weight:bold}button{padding:10px;margin:5px}</style>
<h1>1211 英式英语播放器</h1>
<div class="card"><div id="num"></div><div id="word" class="word"></div><div id="ipa"></div><div id="cn"></div></div>
<button onclick="speak()">播放单词</button><button onclick="next()">下一个</button>
<script>
let ws=[],i=0;
fetch('words.json').then(x=>x.json()).then(x=>{ws=x;show()});
function show(){let w=ws[i];num.textContent=(i+1)+' / '+ws.length;word.textContent=w.word;ipa.textContent=w.ipa;cn.textContent=w.cn}
function next(){i=(i+1)%ws.length;show()}
function speak(){let a=new SpeechSynthesisUtterance(ws[i].word);a.lang='en-GB';speechSynthesis.speak(a)}
</script>
